networks:
  app_bridge:
    name: app_bridge
    external: true

services:
  gtc-mobile:
    build:
      context: ../../
      dockerfile: docker/app/Dockerfile
    container_name: 00-gtc-mobile
    user: node
    hostname: ${HOST_NAME}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ../../:/app:rw
      - /app/node_modules
    command: sh -c "npm install && npx expo start --port 8081"
    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: development
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
    networks:
      - app_bridge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gtc-mobile.rule=Host(`${HOST_NAME}`)"
      - "traefik.http.routers.gtc-mobile.entrypoints=web"
      - "traefik.http.services.gtc-mobile.loadbalancer.server.port=8081"
      - "traefik.http.routers.gtc-mobile.priority=10"
